[package]
name = "novelmatch"
version = "1.0.0"
description = "NovelMatch · 个性化小说质量分析与筛选"
authors = ["NovelMatch"]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "novelmatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "brotli",
    "deflate",
    "charset",
] }
scraper = "0.20"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
regex = "1"
encoding_rs = "0.8"
tokio = { version = "1", features = ["sync", "time", "net", "rt", "macros"] }
tokio-util = "0.7"
keyring = { version = "3", features = [
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
